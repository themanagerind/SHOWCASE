services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Only reachable from this machine (Docker's published ports bypass host firewalls).
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis holds OTPs and rate limits: password required, and only reachable from this machine.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # Behind a reverse proxy, trust X-Forwarded-For ONLY from the proxy (FORWARDED_ALLOW_IPS = its IP/CIDR);
    # otherwise every user shares the proxy IP for rate limits, or (with "*") the header can be forged.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=$${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports: ["8001:8000"]  # 8000 is left free for THE-MANAGER backend on the same machine
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A app.workers.celery_app worker -l info
    depends_on: [db, redis]

  beat:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A app.workers.celery_app beat -l info
    depends_on: [redis]

volumes:
  pgdata:
