[project]
name = "showcase-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "redis>=5.0",
    "celery>=5.4",
    "qrcode[pil]>=7.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5", "fakeredis>=2.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
